# ==============================================================================
# Cowrie Honeypot Configuration - BCSSL Enterprise Lab
# ==============================================================================

[honeypot]
# Simulated hostname and fake environment
hostname = srv-prod-db01
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
share_path = share/cowrie
state_path = var/lib/cowrie
ttylog = true
ttylog_path = var/lib/cowrie/tty

# Fake OS identity
kernel_version = 5.15.0-89-generic
kernel_build_string = #99-Ubuntu SMP Mon Nov 6 12:00:00 UTC 2023
hardware_platform = x86_64
operating_system = GNU/Linux

# Interactive shell limits
interactive_timeout = 300
authentication_timeout = 120

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.4
auth_class = UserDB
user_db_file = etc/userdb.txt

[telnet]
enabled = false

[output_json]
enabled = true
logfile = var/log/cowrie/cowrie.json
epoch_timestamp = false
